  .especies-lista {

  }
  .especie-fila {
    display: block; padding: 2px 0; font-size: 12.5px; cursor: pointer;
  }
  .especie-fila .num { display: inline-block; width: 20px; color: #888; font-size: 11px; }
  .especie-fila.especie-sin-datos { color: #999; cursor: not-allowed; }
  .especie-fila small { font-size: 10.5px; }
  .foto-especie-icono img { width: 35px; height: 60px; object-fit: contain;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,.55)); }

// zoom, sin superponerse con nada sea cual sea el tamano de pantalla.

var FechaControl = L.Control.extend({
  options: { position: 'topleft' },
  onAdd: function () {
    var div = L.DomUtil.create('div', 'fecha-control-caja');
    div.innerHTML =

      '<select id="anio-ndvi" style="flex:1;"></select>' +

      '</div>' +

    L.DomEvent.disableScrollPropagation(div);
    return div;
  }
});

// Documentacion: https://nasa-gibs.github.io/gibs-api-docs/

  return L.tileLayer(
    'https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/MODIS_Terra_L3_NDVI_Monthly/default/' + fecha + '/GoogleMapsCompatible_Level7/{z}/{y}/{x}.png',

      attribution: 'NASA GIBS / MODIS Terra NDVI (compuesto mensual)',
      maxNativeZoom: 7,   // la capa mensual solo se sirve hasta Level7
      maxZoom: 12,
      tileSize: 256,
      opacity: 0.75,
      bounds: [[-85.0511, -180], [85.0511, 180]]
    }
  );
}

var NDVI_MESES = ['enero','febrero','marzo','abril','mayo','junio','julio',

var selAnio = document.getElementById('anio-ndvi');
var selMes = document.getElementById('mes-ndvi');
for (var a = NDVI_ANIO_MAX; a >= NDVI_ANIO_MIN; a--) {
  var o = document.createElement('option'); o.value = a; o.textContent = a; selAnio.appendChild(o);
}
for (var m = 0; m < 12; m++) {
  var om = document.createElement('option'); om.value = m + 1; om.textContent = NDVI_MESES[m]; selMes.appendChild(om);
}
selAnio.value = 2024;  // ultimo anio de floracion documentada con dato satelital
selMes.value = 9;      // septiembre: plena floracion en la ZHCS

function limitarMesesNdvi() {
  // El primer mes disponible es marzo de 2000 y el ultimo, junio de 2026 --
  // se desactivan los meses fuera de rango en vez de dejar elegir un mes que
  // devolveria un tile vacio sin explicacion.
  var a = parseInt(selAnio.value, 10);
  for (var i = 0; i < selMes.options.length; i++) {
    var mes = i + 1;
    var fuera = (a === NDVI_ANIO_MIN && mes < 3) || (a === NDVI_ANIO_MAX && mes > 6);
    selMes.options[i].disabled = fuera;
  }
  if (selMes.options[selMes.selectedIndex] && selMes.options[selMes.selectedIndex].disabled) {
    selMes.value = (a === NDVI_ANIO_MIN) ? 3 : 6;
  }
}
function fechaNdviElegida() {
  return selAnio.value + '-' + String(selMes.value).padStart(2, '0') + '-01';
}
limitarMesesNdvi();
var capaNDVI = construirCapaNDVI(fechaNdviElegida());
capaNDVI.addTo(map);
// Al cambiar de mes se cambia la URL de la MISMA capa (setUrl) en vez de
// destruirla y crear otra. El patron anterior (removeLayer + capa nueva)
// dejaba al control de capas de Leaflet apuntando a la capa vieja: el
// checkbox "NDVI" se desincronizaba y quedaba apagado sin que la capa se
// pudiera volver a encender desde la interfaz.
function urlNdvi(fecha) {
  return 'https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/MODIS_Terra_L3_NDVI_Monthly/default/' +
         fecha + '/GoogleMapsCompatible_Level7/{z}/{y}/{x}.png';
}
function refrescarCapaNdvi() {
  limitarMesesNdvi();
  capaNDVI.setUrl(urlNdvi(fechaNdviElegida()));
}
selAnio.addEventListener('change', refrescarCapaNdvi);
selMes.addEventListener('change', refrescarCapaNdvi);

// ---------- Control de capas GENERAL (mapa base + capas del proyecto) ----------
// Deliberadamente separado del control de ESPECIES (mas abajo) - con 40+
// especies mezclarlas aca haria el panel inmanejable.

// Capa "Estaciones meteorológicas" (06-ago-2026, a pedido de Alexis): TODAS
// las estaciones que tenemos en la base, con serie mensual real de los
// anuarios DMC, para chequear visualmente cobertura y huecos -- en vez de
// confiar en listas de texto (así se encontró el hueco real de Chañaral).
// Visible de entrada, no depende de tildar un checkbox.
function colorPorCobertura(nMeses){
  if(nMeses>=100) return '#7c2d12';
  if(nMeses>=40) return '#c2410c';
  if(nMeses>=10) return '#f97316';
  return '#fed7aa';
}
var capaEstaciones = L.layerGroup(
  Object.keys(TODAS_LAS_ESTACIONES).map(function(nombre){
    var info = TODAS_LAS_ESTACIONES[nombre];
    return L.circleMarker([info.lat, info.lon], {
      radius: 4, color: '#1e293b', weight: 1,
      fillColor: colorPorCobertura(info.n_meses), fillOpacity: 0.9
    }).bindPopup(
      '<b>' + nombre + '</b><br>' +
      'Período con dato real: ' + info.anio_min + '–' + info.anio_max + '<br>' +
      info.n_meses + ' meses reales (de la serie completa del período)<br>' +
      '<small>' + info.lat.toFixed(3) + ', ' + info.lon.toFixed(3) + '</small>'
    );
  })
);
capaEstaciones.addTo(map);

var capasBase = {
  "Mapa claro (CartoDB)": baseClaro,
  "Satelital (Esri)": baseSatelite
};

var capasSuperpuestas = {
  "NDVI NASA GIBS (por mes)": capaNDVI
};
capasSuperpuestas["Estaciones meteorológicas (" + Object.keys(TODAS_LAS_ESTACIONES).length + ")"] = capaEstaciones;

var layersControl = L.control.layers(capasBase, capasSuperpuestas, { collapsed: false }).addTo(map);
capaEstaciones.eachLayer(function(l){ l.bringToFront(); });

L.control.scale({ metric: true, imperial: false }).addTo(map);

// Centro real del area de distribucion (centroide de los 11 especimenes de
// la Tabla S1 para G. kingi) -- calculado en vivo, no un punto fijo, para
// que la foto quede siempre dentro del area sea cual sea el dato.
function centroide(featureCollection) {
  var pts = featureCollection.features.map(function (f) { return f.geometry.coordinates; });
  var lon = pts.reduce(function (s, c) { return s + c[0]; }, 0) / pts.length;
  var lat = pts.reduce(function (s, c) { return s + c[1]; }, 0) / pts.length;
  return [lat, lon];
}

var capaFotoKingi = L.marker(centroide(especiesData['kingi'].puntos), { icon: iconoKingi })
  .bindPopup(
    '<div style="text-align:center;">' +
    '<img src="imagenes/Gyriosomus%20kingi.png" style="width:220px;height:auto;display:block;margin:0 auto 8px;">' +
    '<b><i>Gyriosomus kingi</i></b><br>' +
    'Familia Tenebrionidae (Coleoptera) &mdash; genero <i>Gyriosomus</i>, "vaquitas del desierto"<br>' +
    'Habitat: especialista de dunas y suelo suelto costero<br>' +
    'Dato biogeografico: el rio Huasco actua como barrera genetica entre las poblaciones de <i>G. kingi</i> y <i>G. planatus</i> (Anguita-Salinas et al. 2026)' +
    '</div>',
    { maxWidth: 260 }
  );

// Capas por especie, creadas una sola vez (activadas/desactivadas por
// el checkbox de cada fila). Solo kingi trae ademas la foto.
var capasPorEspecie = {};

especiesOrdenadas.forEach(function (epiteto) {
  var d = especiesData[epiteto];
  var grupo = [];

  var capaPuntos = L.geoJSON(d.puntos, {
    pointToLayer: function (feature, latlng) {
      return L.circleMarker(latlng, {
        radius: 5, color: '#af601a', fillColor: '#f0b27a', fillOpacity: 0.9, weight: 1.5
      });
    },
    onEachFeature: function (feature, layer) {
      var p = feature.properties;
      layer.bindPopup(
        '<b><i>Gyriosomus ' + epiteto + '</i></b><br>' +
        'Voucher: ' + (p.voucher || 'sin dato') + '<br>' +
        'Localidad: ' + (p.localidad || 'sin dato') + ', region ' + (p.region || '?') + '<br>' +
        'Altitud: ' + (p.alt || '?') + ' m &mdash; Año: ' + (p.anio || '?') + '<br>' +
        '<small>Fuente: ' + (p.fuente || 'sin dato') + '</small>'
      );
    }
  });
  grupo.push(capaPuntos);

  if (d.area) {
    var capaArea = L.geoJSON(d.area, {
      style: { color: '#af601a', weight: 2, fillColor: '#f0b27a', fillOpacity: 0.12, dashArray: '4,4' }
    }).bindPopup(
      '<b>Area de distribucion, <i>Gyriosomus ' + epiteto + '</i> &mdash; APROXIMADA</b><br>' +
      'Metodo: envolvente convexa sobre ' + d.n + ' especimenes reales (Tabla S1).<br>' +
      'Sobreestima el area real (no respeta huecos de habitat) &mdash; sirve como primera aproximacion, no como modelo de distribucion.'
    );
    grupo.push(capaArea);
  }

  if (epiteto === 'kingi') {
    grupo.push(capaFotoKingi);
  } else if (d.foto) {
    // Marcador generico de foto real -- cualquier especie con foto CC
    // encontrada por buscar_fotos_especies.py (iNaturalist) la muestra asi,
    // sin necesitar un icono a medida como el de kingi.
    var iconoFoto = L.divIcon({
      className: 'foto-especie-icono',
      html: '<img src="' + d.foto.url + '" alt="Gyriosomus ' + epiteto + '">',
      iconSize: [35, 60],
      iconAnchor: [17, 60],
      popupAnchor: [0, -55]
    });
    var marcadorFoto = L.marker(centroide(d.puntos), { icon: iconoFoto }).bindPopup(
      '<div style="text-align:center;">' +
      '<img src="' + d.foto.url + '" style="width:200px;height:auto;display:block;margin:0 auto 8px;border-radius:4px;">' +
      '<b><i>Gyriosomus ' + epiteto + '</i></b><br>' +
      (d.foto.fuente === 'lamina'
        ? '<small>Lamina: ' + d.foto.atribucion + ' &mdash; ' + d.foto.licencia + '</small>'
        : '<small>Foto: iNaturalist, usuario ' + d.foto.atribucion + ' &mdash; ' + d.foto.licencia + '</small>') +
      (d.foto.pagina_origen ? '<br><small><a href="' + d.foto.pagina_origen + '" target="_blank" rel="noopener">Ver observacion original</a></small>' : '') +
      '</div>',
      { maxWidth: 240 }
    );
    grupo.push(marcadorFoto);
  }

  capasPorEspecie[epiteto] = L.layerGroup(grupo);
});

// ---------- El control en si (checkbox propio, separado del control general) ----------

var EspeciesControl = L.Control.extend({
  options: { position: 'topright' },
  onAdd: function () {
    var div = L.DomUtil.create('div', 'especies-control-caja');

    var header = L.DomUtil.create('div', 'especies-header', div);
    header.innerHTML =
      '<b>Especies (<a href="https://doi.org/10.1111/syen.70011" target="_blank" rel="noopener">Tabla S1</a>)</b> ' +
      '<span class="especies-toggle">&#9660;</span>';
    // el link a la fuente no debe disparar el colapsar/expandir del panel
    header.querySelector('a').addEventListener('click', function (e) { e.stopPropagation(); });

    var toolbar = L.DomUtil.create('div', 'especies-toolbar', div);
    var linkTodas = document.createElement('a');
    linkTodas.href = '#';
    linkTodas.textContent = 'Seleccionar todas';
    var linkNinguna = document.createElement('a');
    linkNinguna.href = '#';
    linkNinguna.textContent = 'Ninguna';
    toolbar.appendChild(linkTodas);
    toolbar.appendChild(document.createTextNode(' · '));
    toolbar.appendChild(linkNinguna);

    var lista = L.DomUtil.create('div', 'especies-lista', div);

    var filasEspecies = []; // { epiteto, chk } - para los botones "todas"/"ninguna"

    especiesOrdenadas.forEach(function (epiteto, idx) {
      var d = especiesData[epiteto];
      var esKingi = (epiteto === 'kingi');
      var fila = L.DomUtil.create('label', 'especie-fila', lista);

      var chk = document.createElement('input');
      chk.type = 'checkbox';
      chk.checked = esKingi;

      fila.appendChild(chk);
      var numero = document.createElement('span');
      numero.className = 'num';
      numero.textContent = (idx + 1) + '.';
      fila.appendChild(numero);
      var texto = document.createElement('span');
      texto.innerHTML = ' <i>G. ' + epiteto + '</i> <small>(n=' + d.n + (d.area ? '' : ', sin area, <3 puntos') + ')</small>' + ((esKingi || d.foto) ? ' 📷' : '');
      fila.appendChild(texto);

      chk.addEventListener('change', function () {
        if (chk.checked) { capasPorEspecie[epiteto].addTo(map); }
        else { map.removeLayer(capasPorEspecie[epiteto]); }
      });

      filasEspecies.push({ epiteto: epiteto, chk: chk });
    });

    linkTodas.addEventListener('click', function (e) {
      e.preventDefault();
      filasEspecies.forEach(function (f) {
        if (!f.chk.checked) {
          f.chk.checked = true;
          capasPorEspecie[f.epiteto].addTo(map);
        }
      });
    });

    linkNinguna.addEventListener('click', function (e) {
      e.preventDefault();
      filasEspecies.forEach(function (f) {
        if (f.chk.checked) {
          f.chk.checked = false;
          map.removeLayer(capasPorEspecie[f.epiteto]);
        }
      });
    });

    header.addEventListener('click', function () {
      lista.style.display = (lista.style.display === 'none') ? 'block' : 'none';
    });

    L.DomEvent.disableClickPropagation(div);
    L.DomEvent.disableScrollPropagation(div);
    return div;
  }
});

var especiesControl = new EspeciesControl();
map.addControl(especiesControl);
capasPorEspecie['kingi'].addTo(map);

// Ancho: al menos el mismo que el control de capas de arriba (medido en
// vivo), pero nunca menos que ESPECIES_ANCHO_MINIMO -- el control general
// resulto mas angosto de lo que este panel necesita para su propio
// contenido (titulo + link + "Seleccionar todas / Ninguna"), asi que
// igualarlo a secas dejaba todo superpuesto.
var ESPECIES_ANCHO_MINIMO = 320;
especiesControl.getContainer().style.width =
  Math.max(layersControl.getContainer().offsetWidth, ESPECIES_ANCHO_MINIMO) + 'px';

</script>
</body>
</html>

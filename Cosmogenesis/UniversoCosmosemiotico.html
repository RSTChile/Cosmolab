     let mx=0;for(const q of [a,b2,c2]){const dx=CS.bx[q]-cx,dy=CS.by[q]-cy,dz=CS.bz[q]-cz;const dd=Math.sqrt(dx*dx+dy*dy+dz*dz);if(dd>mx)mx=dd;}
     if(mx>SEAM)continue;                               // trío inválido: no se liga (evita la raya central)
     CS.col[a]=0;CS.col[b2]=1;CS.col[c2]=2;             // R+G+B → barión de color neutro
     for(const q of [a,b2,c2]){CS.trio[q]=bid;CS.bcx[q]=cx;CS.bcy[q]=cy;CS.bcz[q]=cz;}bid++;}
   CS.nBar=bid;
   // RECOMBINACIÓN: cada electrón se asigna al BARIÓN más cercano (por Morton) → captura por EM.
   // En la fase de átomos cae hacia el centroide de ESE barión (deja de flotar libre).
   const bcen=[],seen={};for(const q of qs){if(CS.trio[q]<0)continue;const t=CS.trio[q];if(seen[t])continue;seen[t]=1;
     bcen.push([CS.bcx[q],CS.bcy[q],CS.bcz[q],morton3(q10(CS.bcx[q]),q10(CS.bcy[q]),q10(CS.bcz[q]))]);}
   bcen.sort((p,q2)=>p[3]-q2[3]);
   if(!bcen.length)bcen.push([0,0,0,0]);              // salvaguarda si no hubo bariones válidos
   for(let i=0;i<N;i++){if(CS.esp[i]!==1)continue;
     const km=mkey(i);let lo=0,hi=bcen.length-1;    // barión con Morton más próximo (búsqueda binaria)
     while(lo<hi){const md=(lo+hi)>>1;if(bcen[md][3]<km)lo=md+1;else hi=md;}
     const bc=bcen[Math.max(0,Math.min(bcen.length-1,lo))];
     CS.bcx[i]=bc[0];CS.bcy[i]=bc[1];CS.bcz[i]=bc[2];}}
  // MASA (#7) × QCD (#22): tamaño de punto. Sin masa → todos iguales; sin QCD → masa ~1% (QCD=99%)
  const masaOn=!CS.off[7],qcdOn=!CS.off[22];
  CS.massN=new Float64Array(N);CS.phase0=new Float64Array(N);
  let mmax=1e-9;
  for(let i=0;i<N;i++){let mv=masaOn?Math.exp(0.6*randn(rng)):1.0;CS.massN[i]=mv;if(mv>mmax)mmax=mv;CS.phase0[i]=rng()*6.2832;}
  // normaliza la FORMA a 0..1; el factor QCD (~99% de la masa) queda como encogimiento GLOBAL visible
  const qcdFac=qcdOn?1:0.12;
  for(let i=0;i<N;i++)CS.massN[i]=(CS.massN[i]/mmax)*qcdFac;
  CS.A=1;CS.tstep=0;CS.phase='singularidad';CS.confined=false;CS.thetaEff=thetaEff;CS.seeds=null;
  tau=0;dStruct=0;let na=0;for(let i=0;i<N;i++)na+=alive[i];nAlive=na;nAnnih=N-na;
  CS.obs={bariones:0,atomos:0,diam:0,dim:0,rug:0,rugNull:0,viva:na,colapso:''};
  buildPoints(N);
}
// ---- un paso físico ----
let CS_jit=mulberry32(777);
const CS_T_END=650;
function stepCS(){
  CS.tstep++;const t=CS.tstep;
  const em=!CS.off[4],fuerte=!CS.off[3],oscura=!CS.off[17],poda=!CS.off[9],inflar=!CS.off[18];
  const memoria=!CS.off[20],catalogo=!CS.off[6],enfria=!CS.off[10],gravedad=!CS.off[2];
  const local=!CS.off[12],pauli=!CS.off[13];        // #12 localidad (dispersión), #13 Pauli (empaquetamiento)
  // Condiciones FALSADAS en el arco (espín #1, causal #15, SSB #16, 3-cuerpos #11): NO cambian la
  // geometría — ese es el resultado. Marca honesta: un destello breve al apagar, sin alterar la nube.
  CS.falsadoOff=(CS.off[1]||CS.off[11]||CS.off[15]||CS.off[16]);
  const distCont=!CS.off[14];                       // #14 distancia continua w∈(0,1] (vs binaria)
  // ganancia de la criba de estructura: memoria(#20) consolida; sin ella, menos contraste denso/vacío
  const gain=(memoria?0.05:0.020)*(distCont?1:0.65);  // memoria consolida el contraste; distancia continua lo afina
  const jmul=local?1:2.4;                            // sin localidad → más dispersión (sin roce que agrupe)
  const scap=pauli?40:80;                            // sin Pauli → los núcleos se sobre-apilan (más brillantes)
  const distinguible=catalogo&&(CS.thetaEff>0||memoria);
  const expande=poda&&inflar;                       // expansión = poda(#9) + inflación(#18)
  const infl=t<CS_T_INFL;
  CS.confined=(t>=CS_T_INFL)&&fuerte;               // los quarks se ligan tras la fase pre-luz
  CS.phase = !distinguible?'sin repertorio distinguible' :
             t<CS_T_SING?'singularidad (plasma denso)' :
             infl?'inflación (pre-luz · quarks con color)' :
             'expansión + fuerzas → hoy';
  if(expande){const h=(infl?(0.014+0.030*CS.exp):(0.0016+0.006*CS.exp))*(enfria?1:0.4);CS.A*=(1+h);}
  if(!oscura){CS.A+=(0.25-CS.A)*0.03;}              // sin 'lejos' → todo se junta (diám 1)
  const temp=enfria?Math.max(0.04,1-t/900):0.7;     // sin enfriar → plasma perpetuo
  const estructura=(t>=CS_T_INFL)&&distinguible;    // fase de estructura (universo ya constituido)
  // ══ RED DE DENSIDAD por CAMPO MEDIO (mecanismo Génesis O(N), el que corre a 100k) ══
  // Los nodos correlacionados con el MODO DOMINANTE emergente CRECEN (sobreviven, brillan);
  // los demás se ANIQUILAN. El contraste denso/vacío (tipo CMB) EMERGE de esa criba, no se pinta.
  // La GRAVEDAD (#2) es el amplificador: sin ella, las fluctuaciones no crecen → campo plano.
  if(estructura&&gravedad){
    const th=CS.thetaEff,c=Math.cos(th),s=Math.sin(th);
    const m=new Float64Array(N),v=new Float64Array(d);
    for(let i=0;i<N;i++){if(!alive[i]){m[i]=0;continue;}m[i]=Math.sqrt(S[i]/(1+S[i]/8));const b=i*d;for(let k=0;k<d;k++)v[k]+=m[i]*U[b+k];}
    const Rv=Float64Array.from(v);Rv[0]=c*v[0]-s*v[1];Rv[1]=s*v[0]+c*v[1];
    for(let i=0;i<N;i++){if(!alive[i])continue;const b=i*d;
      const ru0=c*U[b]-s*U[b+1],ru1=s*U[b]+c*U[b+1];let self=U[b]*ru0+U[b+1]*ru1,dot=U[b]*Rv[0]+U[b+1]*Rv[1];
      for(let k=2;k<d;k++){self+=U[b+k]*U[b+k];dot+=U[b+k]*Rv[k];}
      const dS=gain*m[i]*dot-gain*m[i]*m[i]*self;S[i]+=dS;if(S[i]<0)S[i]=0;if(S[i]>scap)S[i]=scap;
      if(S[i]<=1e-6){alive[i]=0;nAnnih++;}}
  }
  // CONFINAMIENTO (fase INFL→NUC): los 3 quarks de cada barión CONVERGEN a su centroide.
  // Progreso 0→1 en la ventana; al final los 3 puntos coinciden (barión). Sólo si #3 fuerte activa.
  const confW=(t>=CS_T_INFL&&t<CS_T_NUC&&fuerte)?(t-CS_T_INFL)/(CS_T_NUC-CS_T_INFL):(t>=CS_T_NUC&&fuerte?1:0);
  // RECOMBINACIÓN: arranca tras núcleos (CS_T_ATOM), progreso 0→1 en ~80 pasos; sólo con EM (#4).
  const recW=(em&&t>=CS_T_ATOM)?Math.min(1,(t-CS_T_ATOM)/80):0;
  for(let i=0;i<N;i++){
    if(!alive[i]){px[i]=CS.bx[i]*CS.A;py[i]=CS.by[i]*CS.A;pz[i]=CS.bz[i]*CS.A;continue;}
    CS.bx[i]+=(CS_jit()-0.5)*temp*0.006*jmul;CS.by[i]+=(CS_jit()-0.5)*temp*0.006*jmul;CS.bz[i]+=(CS_jit()-0.5)*temp*0.006*jmul;
    // quarks ligados: interpolan hacia el centroide del barión según el progreso de confinamiento
    if(confW>0&&CS.esp&&CS.esp[i]===0&&CS.trio[i]>=0){
      const w=confW*confW;
      px[i]=(CS.bx[i]*(1-w)+CS.bcx[i]*w)*CS.A;py[i]=(CS.by[i]*(1-w)+CS.bcy[i]*w)*CS.A;pz[i]=(CS.bz[i]*(1-w)+CS.bcz[i]*w)*CS.A;
      if(!estructura)S[i]=distinguible?S0*(0.4+0.6*(1-temp)):S0*0.12;
      continue;
    }
    // RECOMBINACIÓN (fase átomos, t≥CS_T_ATOM): el electrón CAE a su barión por EM (#4).
    // Deja de flotar libre: queda ligado a una distancia orbital pequeña alrededor del núcleo.
    if(recW>0&&CS.esp&&CS.esp[i]===1){
      const w=recW,orb=0.12;                          // radio orbital residual (no colapsa al centro)
      px[i]=(CS.bx[i]*(1-w)+CS.bcx[i]*w)*CS.A;py[i]=(CS.by[i]*(1-w)+CS.bcy[i]*w)*CS.A;pz[i]=(CS.bz[i]*(1-w)+CS.bcz[i]*w)*CS.A;
      px[i]+=Math.cos(t*0.12+CS.phase0[i])*orb*w*CS.A;py[i]+=Math.sin(t*0.12+CS.phase0[i])*orb*w*CS.A; // órbita
      if(!estructura)S[i]=distinguible?S0*(0.4+0.6*(1-temp)):S0*0.12;
      continue;
    }
    px[i]=CS.bx[i]*CS.A;py[i]=CS.by[i]*CS.A;pz[i]=CS.bz[i]*CS.A;
    if(!estructura)S[i]=distinguible? S0*(0.4+0.6*(1-temp)) : S0*0.12; // fuera de estructura: brillo por enfriamiento
  }
  if(t%8===0||t===CS_T_INFL){measureCS(distinguible,em,oscura,poda&&inflar);}
}

// ---- observables (grafo kNN por firma, arranque físico) ----
function measureCS(distinguible,em,oscura,poda){
  const cap=Math.min(N,900),o=CS.obs;
  o.bariones=(!CS.off[3])?Math.floor(N/3):0;
  o.atomos=em?(o.bariones||Math.floor(N/3)):0;
  if(!distinguible){o.diam=0;o.dim=0;o.viva=0;o.colapso='θ=0 y sin memoria/catálogo: nada distinguible (silencio, no cierre)';return;}
  o.viva=N;
  if(!em){o.diam=1;o.dim=0;o.colapso='sin EM: sin átomos → geometría colapsa (diám 1)';return;}
  if(!oscura){o.diam=1;o.dim=0;o.colapso="sin sector oscuro: sin 'lejos' → grafo completo (diám 1)";return;}
  let k=Math.max(3,Math.round(6-4*CS.exp));if(poda){k=Math.max(2,Math.round(k*(1-0.6*CS.exp)));}
  const adj=Array.from({length:cap},()=>[]),stp=Math.max(1,Math.floor(N/700));
  for(let i=0;i<cap;i++){const cand=[];
    for(let j=0;j<N;j+=stp){if(j===i||j>=cap)continue;let dd=0;for(let a=0;a<d;a++){const x=U[i*d+a]-U[j*d+a];dd+=x*x;}cand.push([dd,-(U[j*d]*U[j*d]),j]);}
    cand.sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
    for(let q=0;q<k&&q<cand.length;q++){const j=cand[q][2];adj[i].push(j);adj[j].push(i);}}
  const bfs=(src)=>{const D=new Int32Array(cap).fill(-1);D[src]=0;let q=[src],far=src,fd=0;
    while(q.length){const nq=[];for(const u of q)for(const w of adj[u])if(w<cap&&D[w]<0){D[w]=D[u]+1;if(D[w]>fd){fd=D[w];far=w;}nq.push(w);}q=nq;}return[far,fd];};
  let st=0,mx=-1;for(let i=0;i<cap;i++){const mg=U[i*d]*U[i*d];if(mg>mx){mx=mg;st=i;}}
  const [a]=bfs(st),[,diam]=bfs(a);o.diam=diam;o.dim=diam>1?Math.log(cap)/Math.log(diam):0;
  o.colapso=poda?'':'sin expansión/poda: mundo pequeño → diámetro satura';
  CS.adj=adj;
}
window.CS_setN=(v)=>{CS.N=v;};
window.initCS=initCS;window.stepCS=stepCS;
window.renderCS=function(){csPanel();initCS();};
// ---- panel (sliders + 23 checks) ----
function csPanel(){const el=document.getElementById('csPanel');if(el.dataset.done)return;
  let h='<div id="csBtns"><button id="csPlay">⏸ pausa</button><button id="csReset">↺ reset</button><button id="csShuffle">🔀 barajar</button><button id="csRec">⏺ video</button></div>';
  h+='<div class="nota" style="color:#8fb0e0">Arrastra para rotar · rueda para zoom (igual que las otras pestañas). El tiempo está comprimido: 13.800 M de años en la animación.</div>';
  h+='<h4>Condiciones (sliders)</h4>';
  CS072_DATA.sliders.forEach(s=>{h+=`<div class="sl"><label>${s.label}<span class="v" id="csv_${s.id}"></span></label>`
    +`<input type="range" id="cssl_${s.id}" min="${s.min}" max="${s.max}" step="${s.step}" value="${s.val}">`
    +`<div class="nota">${s.nota}</div></div>`;});
  h+='<div id="csApagado"></div><h4>Las 23 Condiciones (apagar una o varias)</h4>';
  let _fase='';
  CS072_DATA.checks.forEach(c=>{
    if(c.fase!==_fase){_fase=c.fase;h+=`<div class="csfase">${c.fase}</div>`;}
    h+=`<label class="cschk" id="csrow_${c.id}"><input type="checkbox" data-id="${c.id}" checked>`
    +`<span><span class="cn">${c.orden}. ${c.nombre}</span><span class="toca">${c.toca}</span><br><span class="ct">apagar → ${c.apagar}</span></span></label>`;});
  h+=`<div class="nota" style="margin-top:10px;border-top:1px solid #1a2438;padding-top:8px">${CS072_DATA.nota_shannon}</div>`;
  el.innerHTML=h;el.dataset.done='1';
  const relaunch=()=>{initCS();playing=true;};
  CS072_DATA.sliders.forEach(s=>{const inp=document.getElementById('cssl_'+s.id),vv=document.getElementById('csv_'+s.id);
    const show=()=>{vv.textContent=(s.id==='theta'||s.id==='exp')?(+inp.value).toFixed(2):inp.value;};show();
    if(s.id==='speed'){cfg.speed=+inp.value;inp.oninput=()=>{show();cfg.speed=+inp.value;};}
    else{inp.oninput=show;inp.onchange=()=>{const v=+inp.value;if(s.id==='N')CS.N=v;else if(s.id==='D')CS.D=v;else if(s.id==='theta')CS.theta=v;else if(s.id==='exp')CS.exp=v;relaunch();};}});
  el.querySelectorAll('.cschk input').forEach(chk=>{chk.onchange=()=>{const id=+chk.dataset.id;CS.off[id]=!chk.checked;
    document.getElementById('csrow_'+id).classList.toggle('off',!chk.checked);
    const offs=CS072_DATA.checks.filter(c=>CS.off[c.id]);
    document.getElementById('csApagado').innerHTML=offs.length?('Apagado → '+offs.map(c=>`<b>${c.nombre}:</b> ${c.apagar}`).join(' · ')):'';
    relaunch();};});
  document.getElementById('csPlay').onclick=()=>{playing=!playing;document.getElementById('csPlay').textContent=playing?'⏸ pausa':'▶ play';};
  document.getElementById('csReset').onclick=relaunch;
  document.getElementById('csRec').onclick=(e)=>toggleRec(e);
  document.getElementById('csShuffle').onclick=()=>{const o=CS.obs,d0=o.diam,dim0=o.dim;
    // NULL real: permuta el orden de las firmas U (relabel). El grafo se arma por firma+magnitud, no por índice.
    const perm=[...Array(N).keys()];for(let i=N-1;i>0;i--){const j=(Math.random()*(i+1))|0;const t=perm[i];perm[i]=perm[j];perm[j]=t;}
    const U2=new Float32Array(N*d);for(let i=0;i<N;i++)for(let a=0;a<d;a++)U2[i*d+a]=U[perm[i]*d+a];U=U2;
    const em=!CS.off[4],oscura=!CS.off[17],poda=!CS.off[9],inflar=!CS.off[18],memoria=!CS.off[20],catalogo=!CS.off[6];
    measureCS(catalogo&&(CS.thetaEff>0||memoria),em,oscura,poda&&inflar);
    const ig=(CS.obs.diam===d0)&&Math.abs((CS.obs.dim||0)-(dim0||0))<0.1;
    document.getElementById('csApagado').innerHTML=`NULL (permutar identidades): diám ${d0}→${CS.obs.diam}, dim ${dim0?dim0.toFixed(2):'—'}→${CS.obs.dim?CS.obs.dim.toFixed(2):'—'}. `+(ig?'No cambian → sin Shannon. ✓':'⚠ cambiaron → habría dependencia del orden.');};
}
function csHud(){const o=CS.obs,emerg=o.rug>o.rugNull*1.3;
  document.getElementById('csHud').innerHTML=
    `<div style="color:#ffd9a0">▸ <b>${CS.phase}</b> · <span style="color:#7a8">t comprimido</span></div>`
   +`<div class="big">dimensión emergente ≈ ${o.dim?o.dim.toFixed(2):'—'}</div>`
   +`<b>N:</b> ${CS.N} · <b>vivas:</b> ${o.viva} · <b>diám:</b> ${o.diam}<br>`
   +`<b>bariones:</b> ${o.bariones} · <b>átomos:</b> ${o.atomos}<br>`
   +(o.colapso?`<span style="color:#ffb060">⚠ ${o.colapso}</span>`:(CS.tstep>=CS_T_INFL?`<span style="color:#4fe08a">tejido con distancia y dimensión</span>`:`<span style="color:#ffd9a0">plasma en expansión…</span>`));
}
window.csHud=csHud;
// ---- línea temporal simplificada ----
const CS_TL=[
  {t:0,   lab:'Singularidad',  sub:'S>0 · plasma denso',           ep:'t = 0',        col:'#ff5a5a'},
  {t:0.10,lab:'Inflación',     sub:'pre-luz · quarks con color',   ep:'10⁻³⁶ s',     col:'#ff8a3a'},
  {t:0.34,lab:'Confinamiento', sub:'fuerte: 3 quarks → 1 barión',  ep:'10⁻⁶ s',      col:'#ffd24a'},
  {t:0.52,lab:'Núcleos',       sub:'débil → p:n 7:1 · He',         ep:'~3 min',      col:'#9be04a'},
  {t:0.65,lab:'Átomos',        sub:'EM → e⁻ ligado · espacio',     ep:'380 000 años',col:'#4fe0c0'},
  {t:0.80,lab:'Estructura',    sub:'gravedad · sector oscuro',     ep:'~200 M años', col:'#5a9cff'},
  {t:1.0, lab:'Hoy',           sub:'expansión acelerada',          ep:'13 800 M años',col:'#c88aff'}
];
function csTLcolor(frac){let c=CS_TL[0].col;for(const m of CS_TL)if(frac>=m.t)c=m.col;return c;}
function csTimeline(){
  const cv2=document.getElementById('csTL');if(cv2.style.display==='none')return;
  const w=cv2.clientWidth,h=cv2.clientHeight,dpr=Math.min(devicePixelRatio||1,2);
  if(cv2.width!==Math.round(w*dpr)){cv2.width=Math.round(w*dpr);cv2.height=Math.round(h*dpr);}
  const x=cv2.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,w,h);
  const padL=54,padR=54,y=h-26,x0=padL,x1=w-padR;   // márgenes amplios: los rótulos de borde NO se cortan
  const X=t=>x0+(x1-x0)*t, clampX=(cx)=>Math.max(padL-38,Math.min(w-padR+38,cx));
  const frac=Math.min(1,CS.tstep/CS_T_END);
  // barra base SEGMENTADA por color de hito (cada tramo su color, atenuado hasta que se alcanza)
  x.lineWidth=3;
  for(let i=0;i<CS_TL.length-1;i++){const a=CS_TL[i],b=CS_TL[i+1];
    x.strokeStyle=a.col;x.globalAlpha=(frac>=a.t)?1:0.28;
    x.beginPath();x.moveTo(X(a.t),y);x.lineTo(X(b.t),y);x.stroke();}
  x.globalAlpha=1;
  // punto de avance, del color del hito vigente
  const xp=X(frac),cc=csTLcolor(frac);
  x.fillStyle=cc;x.beginPath();x.arc(xp,y,5,0,7);x.fill();
  x.strokeStyle='#fff';x.lineWidth=1.2;x.beginPath();x.arc(xp,y,5,0,7);x.stroke();
  // hitos: punto + nombre + época temporal, recortados para no salir del lienzo
  for(const m of CS_TL){const mx=X(m.t),on=frac>=m.t-0.005,tx=clampX(mx);
    x.textAlign=(m.t<=0.02?'left':(m.t>=0.98?'right':'center'));
    const ax=(m.t<=0.02?padL-38:(m.t>=0.98?w-padR+38:tx));
    x.fillStyle=on?m.col:'#465';x.beginPath();x.arc(mx,y,3.5,0,7);x.fill();
    x.fillStyle=on?m.col:'#566';x.font='bold 11px system-ui';x.fillText(m.lab,ax,16);
    x.fillStyle=on?'#c7d4ea':'#586';x.font='9px system-ui';x.fillText(m.ep,ax,28);
    x.fillStyle=on?'#8fa4c8':'#4a566e';x.font='8.5px system-ui';x.fillText(m.sub,ax,40);}
}
window.csTimeline=csTimeline;

initGL();init();loop();setMode('cs');

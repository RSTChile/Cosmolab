Section "ServerLayout"
    Identifier "CabezaE"
    Screen 0 "Screen0"
EndSection

# Sin blanking/DPMS: la SPI no es un monitor con idle; apagarla oculta la cabeza.
# IMPORTANTE: Xorg con -config RELATIVO solo carga desde /etc/X11 (no desde este path).
# Copiar aquí → /etc/X11/xorg-fb1-cabeza-e.conf cuando haya sudo:
#   sudo cp docker/xorg-fb1-cabeza-e.conf /etc/X11/xorg-fb1-cabeza-e.conf
# Mientras tanto ejecutar-cabeza-e-fb1.sh pasa -s 0 -dpms en la CLI de Xorg.
Section "ServerFlags"

    Option "BlankTime" "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime" "0"
EndSection

Section "Device"
    Identifier "FramebufferSPI"
    Driver "fbdev"
    Option "fbdev" "/dev/fb1"
EndSection

Section "Monitor"
    Identifier "MonitorSPI"
    Option "DPMS" "false"
EndSection

Section "Screen"
    Identifier "Screen0"
    Device "FramebufferSPI"
    Monitor "MonitorSPI"
    DefaultDepth 16
EndSection

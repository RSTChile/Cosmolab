# ============================================================================
# DÍADA ANIMA en Docker — A y B vivos 24/7 + membrana MCP. Levanta con:
#     cd Célula_Madre/docker && docker compose up --build -d
# El AudioServer (Rødecaster) corre NATIVO en el Mac, FUERA de Docker; los organismos
# lo consumen por TCP vía host.docker.internal cuando se les configura esa fuente.
# Por defecto viven en soledad (demo:silencio): vivos aunque nadie los observe.
# ============================================================================
name: anima-diada

services:
  anima-a:
    build: { context: .., dockerfile: docker/Dockerfile }
    image: anima-diada:latest
    container_name: anima-a
    environment:
      ANIMA_ROLE: a
      VST_PUERTO: "7788"
      VST_ORGANISMO_ID: ANIMA_A
      VST_COMUNICACION_PEER: http://anima-b:7799/comunicacion/bloque.wav
      VST_SERVIDOR_HOST: host.docker.internal   # alcanza el AudioServer (Rødecaster) NATIVO del Mac
      VST_SERVIDOR_PORT: "8766"                 # puerto donde el AudioServer expone el Rødecaster
      ANIMA_ESCUCHAR_PAR: "1"                   # nace OYENDO la voz del par (díada acoplada A↔B)
      ANIMA_OIDO_PAR: "R"                       # A (izquierda) oye al par por la DERECHA → mira hacia B
    volumes:
      - anima_a_data:/data                 # su disco propio (memoria/codebook/metabolismo persisten)
      - ../../audio_binaural:/app/audio_binaural:ro   # los .wav (Big Bang/Blue Monday) dentro del contenedor
    ports: ["7788:7788"]                   # interfaz web del organismo A
    extra_hosts: ["host.docker.internal:host-gateway"]   # alcanzar el AudioServer nativo del Mac
    restart: unless-stopped

  anima-b:
    image: anima-diada:latest
    build: { context: .., dockerfile: docker/Dockerfile }
    container_name: anima-b
    environment:
      ANIMA_ROLE: b
      VST_PUERTO: "7799"
      VST_ORGANISMO_ID: ANIMA_B
      VST_COMUNICACION_PEER: http://anima-a:7788/comunicacion/bloque.wav
      VST_SERVIDOR_HOST: host.docker.internal
      VST_SERVIDOR_PORT: "8766"
      ANIMA_ESCUCHAR_PAR: "1"
      ANIMA_OIDO_PAR: "L"
    volumes:
      - anima_b_data:/data
      - ../../audio_binaural:/app/audio_binaural:ro
    ports: ["7799:7799"]                   # interfaz web del organismo B
    extra_hosts: ["host.docker.internal:host-gateway"]
    restart: unless-stopped

  anima-mcp:
    image: anima-diada:latest
    container_name: anima-mcp
    environment:
      ANIMA_ROLE: mcp
      ANIMA_A_URL: http://anima-a:7788     # la membrana resuelve A/B por la red interna de compose
      ANIMA_B_URL: http://anima-b:7799
      ANIMA_MCP_HTTP_PORT: "9000"
    ports: ["9000:9000"]                   # membrana MCP (streamable-http) para clientes externos
    depends_on: [anima-a, anima-b]
    restart: unless-stopped

  anima-conversacion:
    image: anima-diada:latest
    container_name: anima-conversacion
    environment:
      ANIMA_ROLE: conversacion
      ANIMA_A_URL: http://anima-a:7788
      ANIMA_B_URL: http://anima-b:7799
      ANIMA_CONV_DIR: /data_conv        # registro PERMANENTE de la conversación (volumen)
      ANIMA_CONV_PORT: "9100"
    volumes:
      - anima_conv_data:/data_conv
    ports: ["9100:9100"]                # tablero del observatorio
    depends_on: [anima-a, anima-b]
    restart: unless-stopped

volumes:
  anima_a_data:
  anima_b_data:
  anima_conv_data:

      - ../audio/VST_AudioDispositivos.py:/app/celula_madre/audio/VST_AudioDispositivos.py:ro
      - ../organelos/VST_OrganoPresencia.py:/app/celula_madre/organelos/VST_OrganoPresencia.py:ro
      - ../organelos/VST_AparienciaCara.py:/app/celula_madre/organelos/VST_AparienciaCara.py:ro
      # Atencion Social (1.2.x): organelo NUEVO, montado para los cuatro organismos.
      - ../organelos/VST_OrganoAtencionSocial.py:/app/celula_madre/organelos/VST_OrganoAtencionSocial.py:ro
      - ../organelos/VST_BitacoraSocial.py:/app/celula_madre/organelos/VST_BitacoraSocial.py:ro
    ports: ["7820:7820"]                   # interfaz web del organismo D
    extra_hosts: ["host.docker.internal:host-gateway"]
    restart: unless-stopped

  anima-mcp:
    image: anima-diada:latest
    container_name: anima-mcp
    environment:
      ANIMA_ROLE: mcp
      ANIMA_A_URL: http://anima-a:7788     # la membrana resuelve A/B por la red interna de compose
      ANIMA_B_URL: http://anima-b:7799
      ANIMA_MCP_HTTP_PORT: "9000"
    ports: ["9000:9000"]                   # membrana MCP (streamable-http) para clientes externos
    depends_on:                            # no arranca hasta que A y B estén SANOS (/estado responde)
      anima-a: { condition: service_healthy }
      anima-b: { condition: service_healthy }
    healthcheck:                           # rol mcp: sobreescribe el del Dockerfile (puerto 9000)
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1',9000),5)"]
      interval: 30s
      timeout: 8s
      start_period: 30s
      retries: 3
    restart: unless-stopped

  anima-conversacion:
    # build: misma imagen que A/B (anima-diada). El código de /stats vive además montado
    # desde el host para no perder el fix P0 al recrear el contenedor sin rebuild.
    build: { context: .., dockerfile: docker/Dockerfile }
    image: anima-diada:latest
    container_name: anima-conversacion
    environment:
      ANIMA_ROLE: conversacion
      ANIMA_A_URL: http://anima-a:7788
      ANIMA_B_URL: http://anima-b:7799
      ANIMA_C_URL: http://anima-c:7810
      ANIMA_D_URL: http://anima-d:7820
      ANIMA_E_URL: http://192.168.86.33:7788   # E vive en la Pi (por IP); el observatorio la alcanza por LAN
      ANIMA_CONV_DIR: /data_conv        # registro PERMANENTE de la conversación (volumen)
      ANIMA_CONV_PORT: "9100"
      VST_HISTORY_DIR: /history
      VST_HISTORY_ENABLE: "true"
      VST_HISTORY_FORMAT: csv
      # Self-heal del histograma /stats (segundos). 0 = solo scan al boot + incremental.
      ANIMA_STATS_REBUILD_S: ${ANIMA_STATS_REBUILD_S:-3600}
    volumes:
      - anima_conv_data:/data_conv
      - ${HISTORY_HOST:-../../Docker_Historia}:/history     # biografía longitudinal en el disco externo (LaCie)
      # Fix P0 /stats (caché + single-flight): siempre el archivo del repo, no el de la imagen vieja.
      - ../conversacion/vst_conversacion.py:/app/celula_madre/conversacion/vst_conversacion.py:ro
    ports: ["9100:9100"]                # tablero del observatorio
    depends_on:                         # espera a que A y B estén SANOS antes de observarlos
      anima-a: { condition: service_healthy }
      anima-b: { condition: service_healthy }
    healthcheck:                        # rol conversacion: puerto 9100
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1',9100),5)"]
      interval: 30s
      timeout: 8s
      start_period: 30s
      retries: 3
    restart: unless-stopped

volumes:
  anima_a_data:
  anima_b_data:
  anima_c_data:
  anima_d_data:
  anima_conv_data:

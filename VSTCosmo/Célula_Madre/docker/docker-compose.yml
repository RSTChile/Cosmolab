# ============================================================================
# DÍADA ANIMA en Docker — A y B vivos 24/7 + membrana MCP. Levanta con:
#     cd Célula_Madre/docker && docker compose up --build -d
# El AudioServer (Rødecaster) corre NATIVO en el Mac, FUERA de Docker; los organismos
# lo consumen por TCP vía host.docker.internal cuando se les configura esa fuente.
# Por defecto viven en soledad (demo:silencio): vivos aunque nadie los observe.
# ============================================================================
name: anima-diada

services:
  anima-a:
    build: { context: .., dockerfile: docker/Dockerfile }
    image: anima-diada:latest
    container_name: anima-a
    environment:
      ANIMA_ROLE: a
      VST_PUERTO: "7788"
      VST_ORGANISMO_ID: ANIMA_A
      ANIMA_PUBLIC_BASE_URL: "http://192.168.86.83:7788"
      VST_ORGANISMO_LABEL: "Alfa"
      ANIMA_CARA_GENERO: masculino
      ANIMA_CARA_TONO: blanco
      # ENSAYO 16-ago-2026 - se parte el ANILLO A>B>C>D>A en dos DIADAS aisladas para poder
      # comparar. En anillo cerrado no hay control posible: la palabra de cualquiera acaba
      # entrando en todos, asi que un cambio de regla contamina el grupo de control y la
      # contaminacion ni siquiera es medible. Diada A<->B = CONTROL (afecto heredado, el de
      # siempre). Diada C<->D = TRATAMIENTO (ANIMA_AFECTO_PROPIO_AL_APRENDER=1). Para volver
      # al anillo: B apunta a anima-c y D a anima-a, y se quitan las dos banderas.
      VST_COMUNICACION_PEER: http://anima-b:7799/comunicacion/bloque.wav   # DIADA CONTROL: A -> B
      ANIMA_ESCUCHAR_TODOS: "1"                  # SOCIEDAD: oye la MEZCLA de todos los demás (todos oyen a todos)
      ANIMA_OTROS_URLS: "http://anima-b:7799/comunicacion/bloque.wav,http://anima-c:7810/comunicacion/bloque.wav,http://anima-d:7820/comunicacion/bloque.wav,http://192.168.86.33:7788/comunicacion/bloque.wav"
      VST_SERVIDOR_HOST: host.docker.internal   # alcanza el AudioServer (Rødecaster) NATIVO del Mac
      VST_SERVIDOR_PORT: "8770"                 # puerto donde el AudioServer expone el Rødecaster
      # PLAZA: ademas de la presencia LAN, late hacia el Observatorio publico (push, NAT-friendly).
      ANIMA_PRESENCE_MODE: "both"
      ANIMA_VISIBILITY: "plaza_publico"
      ANIMA_PLAZA: "1"
      ANIMA_PLAZA_URL: "https://observatorio.cosmosemiotica.cl"
      ANIMA_PLAZA_INTERVAL_S: "20"
      ANIMA_AUDIO_MODE: "server"
      ANIMA_NRF24_URL: http://host.docker.internal:8772   # radio DIGITAL de A: puente nativo al Arduino Uno
      ANIMA_RADIO_A: "1"                         # radio SDR de A: activa el órgano (RSPduo vía SDRconnect)
      ANIMA_RADIO_SINTONIA: "1"                  # CAZA ACTIVA: el órgano barre el espectro, engancha una emisión (por SNR real) y sostiene — oír activo, no pasivo
      ANIMA_SDRWS_URI: ws://192.168.86.250:5454            # API WebSocket del SDRconnect headless (IP LAN del Mac; host.docker.internal da 404 por el Host header)
      ANIMA_ESCUCHAR_PAR: "1"                   # nace OYENDO la voz del par (díada acoplada A↔B)
      ANIMA_OIDO_PAR: "R"                       # A (izquierda) oye al par por la DERECHA → mira hacia B
      ANIMA_OIDO_DIGITAL: "1"                   # OÍDO DIGITAL: el símbolo nRF del otro modula (débil, emergente, falsable) la absorción del par
      ANIMA_MUNDO_CANAL: "0"                    # MUNDO SONORO: canal 1 Rode (Main Mix, con señal). "" = silencio (basal)
      ANIMA_MET_IM_PISO: "0.0"                  # CANÓNICO (CS): probar el lazo de atención SIN bajar el listón. -0.35 = indulgencia (parche)
      # CANÓNICO: alimento = conversión endógena (ICR/ICES). duelo = legacy. Ver VST_Metabolismo.
      ANIMA_MET_ALIMENTO: ${ANIMA_MET_ALIMENTO:-conversion}
      ANIMA_RC_LOOP: "on"
      ANIMA_CONTROL: ${ANIMA_CONTROL:-real}     # control de falsación EN VIVO: real | null | shuffled
      ANIMA_NO_ACUNAR: ${ANIMA_NO_ACUNAR:-}     # ablación experimental: si "1", el tercero es ESTÉRIL (no re-acuña) — C3 tríada
      VST_HISTORY_DIR: /history
      VST_HISTORY_ENABLE: "true"
      VST_HISTORY_FORMAT: csv
      VST_HISTORY_ROTATE_SECONDS: "3600"
      VST_SNAPSHOT_SECONDS: "600"
      VST_RECORD_VOICE_WAV: "true"
      VST_RECORD_EXTERNAL_AUDIO: "false"
      VST_LIFE_MODE: continuous
    volumes:
      - anima_a_data:/data                 # su disco propio (memoria/codebook/metabolismo persisten)
      - ${HISTORY_HOST:-../../Docker_Historia}:/history     # biografía longitudinal en el disco externo (LaCie)
      - ../../audio_binaural:/app/audio_binaural:ro   # los .wav (Big Bang/Blue Monday) dentro del contenedor
      # OrganoMembrana: solo micro-opt de allocs (misma física); montado para no perder el fix.
      - ../organelos/VST_OrganoMembrana.py:/app/celula_madre/organelos/VST_OrganoMembrana.py:ro
      - ../organelos/VST_Metabolismo.py:/app/celula_madre/organelos/VST_Metabolismo.py:ro
      - ../organelos/VST_RC_A.py:/app/celula_madre/organelos/VST_RC_A.py:ro
      # Anadidos 4-ago-2026: sin estos montajes el lab recibia la mitad de las correcciones.
      # La memoria y el calibrador aprenden ahora del impacto real del bocado, y el glosario
      # da el nombre en castellano de cada sigla: sin el no se puede auditar lo que se mide.
      - ../organelos/VST_Memoria.py:/app/celula_madre/organelos/VST_Memoria.py:ro
      - ../organelos/VST_CalibradorLexicoExperiencial.py:/app/celula_madre/organelos/VST_CalibradorLexicoExperiencial.py:ro
      - ../glosario.py:/app/celula_madre/glosario.py:ro
      - ../campo/VST_Celula_Madre_001.py:/app/celula_madre/campo/VST_Celula_Madre_001.py:ro
      - ../campo/Célula_Madre_Funcional_001.py:/app/celula_madre/campo/Célula_Madre_Funcional_001.py:ro
      - ../organelos/VST_OrganoComunicacion.py:/app/celula_madre/organelos/VST_OrganoComunicacion.py:ro
      - ../web/VST_CelulaMadre_WebLive_A.py:/app/celula_madre/web/VST_CelulaMadre_WebLive_A.py:ro
      - ../web/Cajas:/app/celula_madre/web/Cajas:ro
      - ../audio/VST_AudioDispositivos.py:/app/celula_madre/audio/VST_AudioDispositivos.py:ro
      - ../organelos/VST_OrganoPresencia.py:/app/celula_madre/organelos/VST_OrganoPresencia.py:ro
      - ../organelos/VST_AparienciaCara.py:/app/celula_madre/organelos/VST_AparienciaCara.py:ro
      # Atencion Social (1.2.x): organelo NUEVO, solo lo importa el WebLive_A.
      - ../organelos/VST_OrganoAtencionSocial.py:/app/celula_madre/organelos/VST_OrganoAtencionSocial.py:ro
      - ../organelos/VST_BitacoraSocial.py:/app/celula_madre/organelos/VST_BitacoraSocial.py:ro
    ports: ["7788:7788"]                   # interfaz web del organismo A
    extra_hosts: ["host.docker.internal:host-gateway"]   # alcanzar el AudioServer nativo del Mac
    restart: unless-stopped

